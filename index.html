/* ============ GAME SYNC (realtime game rows, reconnect, abandon) ============ */
async function makeGame(w,b,tc){const ms=tc.m*60000;
 const{data,error}=await sb.from('games').insert({white_id:w,black_id:b,time_control:tcKey(tc),tc_minutes:tc.m,tc_inc:tc.i,white_time_ms:ms,black_time_ms:ms}).select().single();

function syncClocks(g){S.t={w:+g.white_time_ms,b:+g.black_time_ms};if(g.moves.length>=2&&g.status==='active')S.t[g.turn]-=Math.max(0,nowS()-Date.parse(g.last_move_at)); /* server timestamp = source of truth */S.last=Date.now()}
function openGame(g){
 if(S.game&&S.game.id===g.id)return;
 leaveGame();S.game=g;S.online=true;const id=S.user.id,C={w:'White',b:'Black'};
 quick=null;clearInterval(qTimer);S.myOpen=null;$('#quickBtn').textContent='⚡ Quick Play';trackMe();$('#chM').classList.remove('on');$('#endM').classList.remove('on');
 G=new Chess();(g.moves||[]).forEach(m=>G.move(m));
 S.myColor=g.white_id===id?'w':'b';S.oppId=g.white_id===id?g.black_id:g.white_id;S.tc={m:g.tc_minutes,i:g.tc_inc};
 S.over=false;S.playing=true;S.sel=null;S.legal=[];S.q=Promise.resolve();syncClocks(g);$('#chat').style.display='';$('#chat').classList.toggle('shut',innerWidth<700);resetChat();
 const top=S.myColor==='w'?'b':'w';
 $('#nBot').textContent=S.prof.display_name+' ('+C[S.myColor]+')';$('#nTop').textContent='… ('+C[top]+')';
 show('game');renderAll();
 sb.from('profiles').select('display_name,rating').eq('id',S.oppId).single().then(({data})=>{if(data&&S.game&&S.game.id===g.id){S.oppName=data.display_name;$('#nTop').textContent=`${data.display_name} ${data.rating} (${C[top]})`}});
 gameCh=sb.channel('game-'+g.id,{config:{presence:{key:id}}})
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'games',filter:'id=eq.'+g.id},p=>onGameRow(p.new))
  .on('presence',{event:'sync'},onGamePresence)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'game_id=eq.'+g.id},p=>onMsg(p.new))
  .on('broadcast',{event:'rtc'},p=>onRtc(p.payload))
  .subscribe(s=>{if(s==='SUBSCRIBED'){gameCh.track({});loadGame();loadMsgs()}});
 if(g.status==='finished')end(resText(g),true)}
async function loadGame(){if(!S.game)return;const{data}=await sb.from('games').select('*').eq('id',S.game.id).single();if(data)onGameRow(data)}
function onGameRow(g){
 if(!S.game||g.id!==S.game.id)return;
 const h=G.history(),mv=g.moves||[];
 if(mv.length<h.length||mv.slice(0,h.length).join()!==h.join()){G=new Chess();mv.forEach(m=>G.move(m));S.sel=null;S.legal=[];syncClocks(g);renderAll()} /* server state wins (rejected move / reconnect) */
 else if(mv.length>h.length){for(let i=h.length;i<mv.length;i++)G.move(mv[i]);S.sel=null;S.legal=[];syncClocks(g);afterMove(1)}
 else syncClocks(g);
 S.game=g;
 if(g.status==='finished'){end(resText(g),true);showDelta(g)}
 else if(g.draw_offer_by&&g.draw_offer_by!==S.user.id&&!S.gotOffer){S.gotOffer=1;setTimeout(()=>{const ok=confirm('Your opponent offers a draw. Accept?');S.gotOffer=0;if(S.game&&!S.over)Net.answerDraw(ok)},30)}}

 if(S.prof){S.prof.rating=Math.max(100,r0+d);setHello();trackMe()}
 $('#endT').textContent+=`\nRating ${r0} → ${Math.max(100,r0+d)} (${d>=0?'+':''}${d})`}
function onGamePresence(){ /* abandon rule: opponent gone for 60 s -> you win */
 if(!gameCh||S.over||!S.game)return;
 if(gameCh.presenceState()[S.oppId]){clearTimeout(absentT);absentT=null}
 else if(!absentT){toast('Opponent disconnected – you win in 60 s if they do not return');absentT=setTimeout(()=>{if(!S.over&&S.game)end((S.myColor==='w'?'White':'Black')+' wins – opponent left')},60000)}}
function leaveGame(){endCall();if($('#chat'))$('#chat').style.display='none';clearTimeout(absentT);absentT=null;if(gameCh&&sb){sb.removeChannel(gameCh)}gameCh=null;S.online=false;S.game=null;S.oppId=null}
const Net={
 sendMove(){if(!S.online)return;const id=S.game.id,h=G.history(),f=G.fen();Q(async()=>{const{error}=await sb.from('games').update({moves:h,fen:f}).eq('id',id);if(error){toast('Move rejected – resyncing');loadGame()}})},
 offerDraw(){const id=S.game.id;Q(()=>sb.from('games').update({draw_offer_by:S.user.id}).eq('id',id))},
 answerDraw(ok){const id=S.game.id;Q(()=>sb.from('games').update(ok?{status:'finished',result:'1/2-1/2',result_reason:'agreement'}:{draw_offer_by:null}).eq('id',id))},
 resign(){},
 sendResult(msg){if(!S.online)return;const id=S.game.id,why=(RS.find(([k])=>msg.includes(k))||[0,'draw'])[1],res=msg.startsWith('White wins')?'1-0':msg.startsWith('Black wins')?'0-1':'1/2-1/2';
  Q(async()=>{const{error}=await sb.from('games').update({status:'finished',result:res,result_reason:why}).eq('id',id);if(error)console.warn(error.message)})}
};

/* ============ WEBRTC (Part 3): 1-to-1 voice/video, signalling over the game's Supabase broadcast channel ============ */
/* STUN only (works for most networks). Behind strict NATs/firewalls add a TURN server here, e.g.
   {urls:'turn:your.turn.host:3478',username:'USER',credential:'PASS'}  (Metered, Twilio, coturn ...) */
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
let pc=null,local=null,iceQ=[],pendingInv=null;
const rtcSend=p=>{if(gameCh)gameCh.send({type:'broadcast',event:'rtc',payload:p})},callSt=t=>{$('#callSt').textContent=t};
async function media(kind){
 if(!navigator.mediaDevices||!window.RTCPeerConnection){toast('Calls need a modern browser and HTTPS');return null}
 try{return await navigator.mediaDevices.getUserMedia({audio:true,video:kind==='video'})}
 catch(e){toast(e.name==='NotAllowedError'?'Permission denied – allow mic/camera in your browser settings':e.name==='NotFoundError'?'No microphone/camera found':'Could not access mic/camera');return null}}
async function startCall(kind){if(!S.online||pc||local||pendingInv)return;if(blocked.has(S.oppId))return toast('You blocked this player');
 local=await media(kind);if(!local)return;tile('local',local,1);callSt('Calling…');rtcSend({t:'invite',kind})}
function mkPc(){pc=new RTCPeerConnection({iceServers:ICE});iceQ=[];local.getTracks().forEach(t=>pc.addTrack(t,local));
 pc.onicecandidate=e=>{if(e.candidate)rtcSend({t:'ice',c:e.candidate})};
 pc.ontrack=e=>tile('remote',e.streams[0],0);
 pc.onconnectionstatechange=()=>{const s=pc&&pc.connectionState;if(s==='connected')callSt('Connected');else if(s==='disconnected')callSt('Connection lost – trying to reconnect…');else if(s==='failed'){toast('Call failed');endCall()}}}
async function flushIce(){for(const c of iceQ)await pc.addIceCandidate(c).catch(()=>{});iceQ=[]}
async function onRtc(m){
 if(!m||blocked.has(S.oppId))return;
 try{
 if(m.t==='invite'){if(pc||local||pendingInv)return rtcSend({t:'busy'});pendingInv=m.kind;$('#callT').textContent=`${S.oppName||'Opponent'} invites you to a ${m.kind} call`;$('#callM').classList.add('on')}
 else if(m.t==='accept'&&local&&!pc){mkPc();const o=await pc.createOffer();await pc.setLocalDescription(o);rtcSend({t:'offer',d:o})}
 else if(m.t==='offer'&&pc){await pc.setRemoteDescription(m.d);await flushIce();const a=await pc.createAnswer();await pc.setLocalDescription(a);rtcSend({t:'answer',d:a})}
 else if(m.t==='answer'&&pc){await pc.setRemoteDescription(m.d);await flushIce()}
 else if(m.t==='ice'){if(pc&&pc.remoteDescription)await pc.addIceCandidate(m.c).catch(()=>{});else iceQ.push(m.c)}
 else if(m.t==='decline'||m.t==='busy'){toast(m.t==='busy'?'Opponent is busy':'Call declined');endCall(1)}
 else if(m.t==='end'){if(pc||local||pendingInv)toast('Call ended');endCall(1)}
 }catch(e){console.warn(e);toast('Call error');endCall()}}
$('#callAcc').onclick=async()=>{$('#callM').classList.remove('on');const k=pendingInv;pendingInv=null;if(!k)return;
 local=await media(k);if(!local){rtcSend({t:'decline'});return}tile('local',local,1);mkPc();callSt('Connecting…');rtcSend({t:'accept'})};
$('#callDec').onclick=()=>{$('#callM').classList.remove('on');pendingInv=null;rtcSend({t:'decline'})};
$('#cVoice').onclick=()=>startCall('voice');$('#cVideo').onclick=()=>startCall('video');

 const h=+$('#cH').value||0,m=+$('#cM').value||0,i=+$('#cI').value||0;
 if([h,m,i].some(v=>v<0||!Number.isInteger(v))){$('#eTc').textContent='Use whole, non-negative numbers.';return null}

function kingSq(c){const b=G.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(p&&p.type==='k'&&p.color===c)return'abcdefgh'[f]+(8-r)}}
function renderBoard(){
 const el=$('#board');el.innerHTML='';const flip=S.myColor==='b',F='abcdefgh';
 const h=G.history({verbose:true}),lm=h[h.length-1],ks=G.in_check()?kingSq(G.turn()):null;
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const fi=flip?7-c:c,ri=flip?r:7-r,sq=F[fi]+(ri+1),d=document.createElement('div'),p=G.get(sq);
  d.className='sq '+((fi+ri)%2?'l':'d');d.dataset.sq=sq;
  if(lm&&(lm.from===sq||lm.to===sq))d.classList.add('last');
  if(S.sel===sq)d.classList.add('sel');
  if(S.legal.includes(sq))d.classList.add(p||(G.get(S.sel)?.type==='p'&&sq[0]!==S.sel[0])?'cap':'mv');
  if(sq===ks)d.classList.add('chk');
  if(c===7)d.insertAdjacentHTML('beforeend',`<span class="rk">${ri+1}</span>`);
  if(r===7)d.insertAdjacentHTML('beforeend',`<span class="fl">${F[fi]}</span>`);
  if(p)d.insertAdjacentHTML('beforeend',`<img draggable="false" src="${pieceURI(S.theme,p.color,p.type)}">`);
  el.appendChild(d)}}
function fmt(ms){ms=Math.max(0,ms);if(ms<10000){const s=Math.floor(ms/1000),t=Math.floor(ms%1000/100);return`0:0${s}.${t}`}
 const s=Math.ceil(ms/1000),H=Math.floor(s/3600),M=Math.floor(s%3600/60),X=String(s%60).padStart(2,'0');
 return H?`${H}:${String(M).padStart(2,'0')}:${X}`:`${M}:${X}`}

 [['#cTop',top],['#cBot',S.myColor]].forEach(([id,c])=>{const e=$(id);e.textContent=fmt(S.t[c]);
  e.classList.toggle('act',S.playing&&!S.over&&G.turn()===c);e.classList.toggle('low',S.t[c]<10000)})}

-- Run once in Supabase: SQL Editor -> New query -> paste -> Run

-- ===== PROFILES =====
create table public.profiles(
 id uuid primary key references auth.users on delete cascade,
 display_name text not null check (char_length(display_name) between 1 and 20),
 rating int not null default 1200,
 is_online boolean not null default false,
 last_seen timestamptz not null default now());
alter table public.profiles enable row level security;
create policy "profiles readable" on public.profiles for select to authenticated using (true);
create policy "update own profile" on public.profiles for update to authenticated using (auth.uid()=id) with check (auth.uid()=id);
revoke update on public.profiles from authenticated;
grant update (display_name,is_online,last_seen) on public.profiles to authenticated; -- rating cannot be edited by clients

-- profile row is created automatically on sign-up (works before email confirmation)
create function public.handle_new_user() returns trigger language plpgsql security definer set search_path=public as $$
begin
 insert into public.profiles(id,display_name)
 values(new.id, coalesce(nullif(left(new.raw_user_meta_data->>'display_name',20),''), left(split_part(new.email,'@',1),20)))
 on conflict do nothing;
 return new;
end $$;
create trigger on_auth_user_created after insert on auth.users for each row execute function public.handle_new_user();

create function public.server_time() returns timestamptz language sql stable as 'select now()';

-- ===== CHALLENGES =====
create table public.challenges(
 id uuid primary key default gen_random_uuid(),
 from_user uuid not null references public.profiles(id) on delete cascade,
 to_user uuid references public.profiles(id) on delete cascade, -- null = open challenge
 time_control text not null,
 tc_minutes int not null check (tc_minutes>=0),
 tc_inc int not null check (tc_inc>=0),
 colour_pref text not null default 'r' check (colour_pref in ('w','b','r')), -- challenger's colour
 status text not null default 'open' check (status in ('open','accepted','declined','cancelled')),
 created_at timestamptz not null default now(),
 check (tc_minutes>=1 or tc_inc>0));
alter table public.challenges enable row level security;
create policy "see relevant challenges" on public.challenges for select to authenticated
 using (to_user is null or to_user=auth.uid() or from_user=auth.uid());
create policy "create own challenge" on public.challenges for insert to authenticated
 with check (auth.uid()=from_user and status='open' and to_user is distinct from from_user);
create policy "answer or cancel" on public.challenges for update to authenticated
 using (status='open' and (from_user=auth.uid() or to_user is null or to_user=auth.uid()))
 with check ((auth.uid()=from_user and status='cancelled')
  or (auth.uid()<>from_user and (status='accepted' or (status='declined' and to_user=auth.uid()))));

-- ===== GAMES =====
create table public.games(
 id uuid primary key default gen_random_uuid(),
 white_id uuid not null references public.profiles(id),
 black_id uuid not null references public.profiles(id),
 time_control text not null,
 tc_minutes int not null,
 tc_inc int not null,
 fen text not null default 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
 moves text[] not null default '{}', -- SAN, one entry per half-move
 white_time_ms bigint not null,
 black_time_ms bigint not null,
 turn text not null default 'w' check (turn in ('w','b')),
 status text not null default 'active' check (status in ('active','finished')),
 result text check (result in ('1-0','0-1','1/2-1/2')),
 result_reason text,
 draw_offer_by uuid,
 created_at timestamptz not null default now(),
 last_move_at timestamptz not null default now(),
 check (white_id<>black_id));
alter table public.games enable row level security;
create policy "players read game" on public.games for select to authenticated using (auth.uid() in (white_id,black_id));
create policy "players create game" on public.games for insert to authenticated
 with check (auth.uid() in (white_id,black_id) and status='active' and moves='{}'
  and white_time_ms=tc_minutes*60000 and black_time_ms=tc_minutes*60000);
create policy "players update game" on public.games for update to authenticated
 using (auth.uid() in (white_id,black_id)) with check (auth.uid() in (white_id,black_id));

-- Server-side guard: only the side to move may add exactly one move; clocks/turn/timestamp are computed by the server.
create function public.games_guard() returns trigger language plpgsql as $$
declare n int := coalesce(array_length(old.moves,1),0);
 el numeric := extract(epoch from (now()-old.last_move_at))*1000; t numeric;
begin
 if old.status='finished' then raise exception 'game finished'; end if;
 if new.draw_offer_by is not null and new.draw_offer_by<>auth.uid() then raise exception 'bad draw offer'; end if;
 new.id:=old.id; new.white_id:=old.white_id; new.black_id:=old.black_id; new.time_control:=old.time_control;
 new.tc_minutes:=old.tc_minutes; new.tc_inc:=old.tc_inc; new.created_at:=old.created_at;
 new.white_time_ms:=old.white_time_ms; new.black_time_ms:=old.black_time_ms; new.turn:=old.turn; new.last_move_at:=old.last_move_at;
 if new.moves is distinct from old.moves then
  if auth.uid() is distinct from (case old.turn when 'w' then old.white_id else old.black_id end) then raise exception 'not your turn'; end if;
  if coalesce(array_length(new.moves,1),0)<>n+1 then raise exception 'exactly one move per update'; end if;
  if n>=2 then
   t := (case old.turn when 'w' then old.white_time_ms else old.black_time_ms end) - el;
   if t<=0 then raise exception 'out of time'; end if;
   t := t + old.tc_inc*1000;
   if old.turn='w' then new.white_time_ms:=t; else new.black_time_ms:=t; end if;
  end if;
  new.turn := case old.turn when 'w' then 'b' else 'w' end;
  new.last_move_at := now(); new.draw_offer_by := null;
 else
  new.fen := old.fen;
 end if;
 if new.status='finished' then
  if new.result is null then raise exception 'result required'; end if;
  if new.result_reason='resign' and not ((auth.uid()=old.white_id and new.result='0-1') or (auth.uid()=old.black_id and new.result='1-0')) then raise exception 'bad resignation'; end if;
  if new.result_reason='time' then
   t := (case old.turn when 'w' then old.white_time_ms else old.black_time_ms end) - el;
   if n<2 or t>1500 or new.result<>(case old.turn when 'w' then '0-1' else '1-0' end) then raise exception 'not a timeout'; end if;
  end if;
  if new.result_reason='agreement' and (old.draw_offer_by is null or old.draw_offer_by=auth.uid() or new.result<>'1/2-1/2') then raise exception 'no draw offer'; end if;
 end if;
 return new;
end $$;
create trigger games_guard_trg before update on public.games for each row execute function public.games_guard();

-- ===== MESSAGES (used in Part 3) =====
create table public.messages(
 id bigint generated always as identity primary key,
 game_id uuid not null references public.games(id) on delete cascade,
 sender_id uuid not null references public.profiles(id),
 body text not null check (char_length(body) between 1 and 500),
 created_at timestamptz not null default now());
alter table public.messages enable row level security;
create policy "players read chat" on public.messages for select to authenticated
 using (exists(select 1 from public.games g where g.id=game_id and auth.uid() in (g.white_id,g.black_id)));
create policy "players send chat" on public.messages for insert to authenticated
 with check (sender_id=auth.uid() and exists(select 1 from public.games g where g.id=game_id and auth.uid() in (g.white_id,g.black_id)));

-- ===== REALTIME =====
alter publication supabase_realtime add table public.profiles, public.challenges, public.games, public.messages;
alter table public.games replica identity full;
alter table public.challenges replica identity full;

-- ===== PART 3: blocks, reports, block-aware chat =====
-- (If you already ran the Part 2 SQL, you can run just this section.)
create table if not exists public.blocks(
 blocker_id uuid not null references public.profiles(id) on delete cascade,
 blocked_id uuid not null references public.profiles(id) on delete cascade,
 created_at timestamptz not null default now(),
 primary key(blocker_id,blocked_id), check(blocker_id<>blocked_id));
alter table public.blocks enable row level security;
drop policy if exists "manage own blocks" on public.blocks;
create policy "manage own blocks" on public.blocks for all to authenticated using (blocker_id=auth.uid()) with check (blocker_id=auth.uid());

create table if not exists public.reports(
 id bigint generated always as identity primary key,
 reporter_id uuid not null references public.profiles(id) on delete cascade,
 reported_id uuid not null references public.profiles(id) on delete cascade,
 game_id uuid references public.games(id) on delete set null,
 reason text not null check (char_length(reason) between 1 and 500),
 created_at timestamptz not null default now());
alter table public.reports enable row level security;
drop policy if exists "file reports" on public.reports;
create policy "file reports" on public.reports for insert to authenticated with check (reporter_id=auth.uid());
-- reports are read by you in the Supabase dashboard (no select policy for clients)

create or replace function public.blocked_between(a uuid,b uuid) returns boolean language sql security definer set search_path=public stable
 as 'select exists(select 1 from public.blocks where (blocker_id=a and blocked_id=b) or (blocker_id=b and blocked_id=a))';
drop policy if exists "players send chat" on public.messages;
create policy "players send chat" on public.messages for insert to authenticated
 with check (sender_id=auth.uid() and exists(select 1 from public.games g where g.id=game_id and auth.uid() in (g.white_id,g.black_id) and not public.blocked_between(g.white_id,g.black_id)));

 add column if not exists white_rating int,
 add column if not exists black_rating int,

-- Elo (K=32) is calculated on the server when a game finishes; clients cannot edit ratings. Games shorter than 2 half-moves are unrated.
create or replace function public.games_rate() returns trigger language plpgsql security definer set search_path=public as $$
declare rw int; rb int; ew numeric; sw numeric; dw int := 0;
begin
 if old.status='active' and new.status='finished' then
  select rating into rw from public.profiles where id=new.white_id;
  select rating into rb from public.profiles where id=new.black_id;
  new.white_rating:=rw; new.black_rating:=rb;
  if coalesce(array_length(new.moves,1),0)>=2 then
   ew := 1/(1+power(10,(rb-rw)/400.0));
   sw := case new.result when '1-0' then 1 when '0-1' then 0 else 0.5 end;
   dw := round(32*(sw-ew));
  end if;
  new.white_delta:=dw; new.black_delta:=-dw;
  update public.profiles set rating=greatest(100,rating+dw) where id=new.white_id;
  update public.profiles set rating=greatest(100,rating-dw) where id=new.black_id;
 else
  new.white_rating:=old.white_rating; new.black_rating:=old.black_rating;
  new.white_delta:=old.white_delta; new.black_delta:=old.black_delta;
 end if;
 return new;
end $$;
